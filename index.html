<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;direction:rtl;background:#f8f7f4;color:#111827;min-height:100vh;}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
.app{max-width:1300px;margin:0 auto;padding:20px 16px;}
.app-header{text-align:center;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #e5e7eb;}
.app-logo{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
.app-logo span{color:#a78bfa;}
.app-tagline{font-size:13px;color:#9ca3af;margin-top:4px;font-style:italic;}

/* NOTIFICATION SYSTEM STYLES */
.notification-panel {display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.btn-noti {background:#fff;color:#4b5563;border:1px solid #d1d5db;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Heebo',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px;}
.btn-noti:hover {background:#f9fafb;border-color:#9ca3af;color:#111827;}
.btn-noti.active {background:#ecfdf5;color:#059669;border-color:#10b981;}
.btn-test-noti {background:#f3e8ff;color:#6b21a8;border:1px solid #d8b4fe;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Heebo',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px;}
.btn-test-noti:hover {background:#e9d5ff;}

/* PERSISTENT BANNER STYLES */
.alert-banner {background:linear-gradient(90deg, #fee2e2, #fef2f2);border:1px solid #fca5a5;border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:between;gap:12px;box-shadow:0 4px 12px rgba(220,38,38,0.05);display:none;}
.alert-banner-content {display:flex;align-items:center;gap:10px;flex:1;}
.alert-banner-text {font-size:13px;font-weight:600;color:#991b1b;}

/* SATURDAY REPORT MODAL STYLES */
.report-card {background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:10px;}
.report-stat {display:flex;justify-content:space-between;align-items:center;font-size:13px;border-bottom:1px dashed #e5e7eb;padding-bottom:6px;}
.report-stat:last-child {border-bottom:none;padding-bottom:0;}
.report-badge {font-weight:700;font-size:14px;padding:2px 8px;border-radius:20px;}

.main-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
.right-col{display:flex;flex-direction:column;gap:20px;}

/* DESKTOP WEEKLY GRID */
.week-header-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px;}
.day-col{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day-header{text-align:center;font-size:11px;font-weight:600;color:#6b7280;padding:4px 2px;}
.day-header.weekend{color:#a78bfa;}

/* RESPONSIVE DESIGN FOR MOBILE BREAKPOINT */
@media(max-width:900px){
  .main-layout{grid-template-columns:1fr;}
  /* Change 7 columns grid to a vertical stack for mobile comfort */
  .week-header-row {display:none;} /* Hide the tiny horizontal headers */
  .day-col {grid-template-columns: 1fr; gap: 10px;}
  .day-slot {min-height: 75px; padding: 12px; align-items: flex-start; justify-content: flex-start; border-style: solid; background: #fff;}
  /* Prepend the day name dynamically on mobile view */
  .day-slot::before {
    content: "יום " attr(data-dayname) ":";
    font-size: 12px;
    font-weight: 700;
    color: #6b7280;
    margin-bottom: 4px;
    display: block;
  }
  .day-slot.weekend-slot::before { color: #a78bfa; }
}

.panel{background:#fff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden;}
.panel-header{padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.panel-title{font-size:16px;font-weight:600;}
.panel-body{padding:16px 20px;}
.btn-primary{background:#111827;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Heebo',sans-serif;transition:opacity .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.btn-primary:hover{opacity:.82;}
.btn-auto{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Heebo',sans-serif;transition:opacity .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 2px 8px rgba(124,58,237,0.25);}
.btn-auto:hover{opacity:.88;}
.btn-ghost{background:none;border:1px solid #e5e7eb;border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Heebo',sans-serif;color:#6b7280;transition:all .15s;}
.btn-ghost:hover{border-color:#9ca3af;color:#111827;}
.btn-icon{background:none;border:none;cursor:pointer;border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#9ca3af;transition:all .15s;flex-shrink:0;}
.btn-icon:hover{background:#f3f4f6;color:#374151;}
.btn-icon.danger:hover{background:#fee2e2;color:#dc2626;}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.pill{border:1.5px solid transparent;border-radius:100px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
.pill.active{border-color:currentColor;box-shadow:0 0 0 2px rgba(0,0,0,0.05);}
.pill-all{background:#f3f4f6;color:#111827;}
.pill-all.active{background:#111827;color:#fff;border-color:#111827;}
.pill-done{background:#f3f4f6;color:#6b7280;}
.pill-done.active{background:#6b7280;color:#fff;border-color:#6b7280;}
.prog-wrap{height:4px;background:#f3f4f6;border-radius:100px;margin-bottom:16px;overflow:hidden;}
.prog-bar{height:100%;border-radius:100px;background:#a78bfa;transition:width .4s ease;}
.task-list{display:flex;flex-direction:column;gap:8px;min-height:60px;}
.task-empty{text-align:center;padding:24px 16px;color:#9ca3af;font-size:13px;}
.task-card{border-radius:10px;padding:11px 13px;border:1.5px solid transparent;display:flex;align-items:flex-start;gap:10px;transition:transform .15s,box-shadow .15s;}
.task-card:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,0.07);}
.task-card.done .task-title{text-decoration:line-through;opacity:.45;}
.task-card.done{opacity:.7;}
.task-check{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,0.18);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:2px;background:rgba(255,255,255,0.6);}
.task-check.checked{background:rgba(0,0,0,0.12);border-color:rgba(0,0,0,0.2);}
.chk-mark{display:none;font-size:10px;}
.task-check.checked .chk-mark{display:block;}
.task-content{flex:1;min-width:0;}
.task-title{font-size:13px;font-weight:500;line-height:1.4;word-break:break-word;}
.task-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
.cat-badge{font-size:10px;font-weight:500;padding:1px 7px;border-radius:100px;border:1px solid rgba(0,0,0,0.09);}
.prio-tag{font-size:10px;padding:1px 7px;border-radius:100px;font-weight:600;}
.prio-high{background:#fee2e2;color:#dc2626;}
.prio-med{background:#fef9c3;color:#854d0e;}
.prio-low{background:#dcfce7;color:#166534;}
.task-date{font-size:10px;color:#9ca3af;}
.task-note{font-size:11px;color:#6b7280;margin-top:3px;line-height:1.4;}
.task-actions{display:flex;gap:1px;opacity:0;transition:opacity .15s;}
.task-card:hover .task-actions{opacity:1;}
.section-label{font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.4px;padding:10px 0 6px;border-top:1px solid #f3f4f6;margin-top:6px;}
.section-label:first-child{border-top:none;padding-top:0;}
.cat-list{display:flex;flex-direction:column;gap:7px;}
.cat-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;border:1.5px solid rgba(0,0,0,0.07);cursor:pointer;transition:all .15s;}
.cat-item:hover{transform:translateX(-2px);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cat-name{font-size:12px;font-weight:500;flex:1;}
.cat-count{font-size:11px;}
.day-slot{border-radius:12px;border:1.5px dashed #e5e7eb;background:#fafafa;min-height:90px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .2s;position:relative;}
.day-slot.has-task{border-style:solid;justify-content:flex-start;background:#fff;}
.day-slot.weekend-slot{background:#fdf8ff;border-color:#e9d5ff;}
.day-slot.weekend-slot:not(.has-task){cursor:pointer;}
.day-slot.weekend-slot:not(.has-task):hover{background:#f5f0ff;border-color:#c4b5fd;}
.day-slot.drag-over{background:#f0f9ff;border-color:#7dd3fc;border-style:solid;}
.day-add-btn{font-size:20px;color:#d8b4fe;cursor:pointer;line-height:1;}
.day-add-btn:hover{color:#7c3aed;}
.day-empty-label{font-size:10px;color:#c4b5fd;text-align:center;margin-top:2px;}
.sched-card{border-radius:8px;padding:8px 9px;border:1.5px solid transparent;width:100%;display:flex;flex-direction:column;gap:4px;}
.sched-card.done .sched-title{text-decoration:line-through;opacity:.45;}
.sched-title{font-size:12px;font-weight:500;line-height:1.3;word-break:break-word;}
.sched-cat{font-size:10px;font-weight:500;opacity:.7;}
.sched-actions{display:flex;gap:2px;justify-content:flex-end;margin-top:2px;}
.sched-check{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,0.18);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.55);transition:all .15s;}
.sched-check.checked{background:rgba(0,0,0,0.12);border-color:rgba(0,0,0,0.2);}
.sched-chk-icon{display:none;font-size:9px;}
.sched-check.checked .sched-chk-icon{display:block;}
.sched-top-row{display:flex;align-items:flex-start;gap:6px;}
.sched-info{flex:1;min-width:0;}
.algo-note{font-size:11px;border-radius:8px;padding:7px 10px;margin-bottom:12px;line-height:1.5;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.28);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.14);}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px;}
.form-group{margin-bottom:13px;}
.form-label{font-size:12px;font-weight:500;color:#6b7280;margin-bottom:5px;display:block;}
.form-input{width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:13px;font-family:'Heebo',sans-serif;background:#fff;color:#111827;transition:border-color .15s;direction:rtl;}
.form-input:focus{outline:none;border-color:#a78bfa;}
.form-textarea{resize:vertical;min-height:70px;}
.form-row{display:flex;gap:10px;}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;}
.color-input{width:40px;height:36px;border:1.5px solid #e5e7eb;border-radius:10px;cursor:pointer;padding:2px;background:none;}
.fade-in{animation:fi .2s ease forwards;}
@keyframes fi{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
</style>

<h2 class="sr-only">מנהל משימות עם לוח שבועי</h2>
<div class="app">
  <div class="app-header">
    <div class="app-logo">מש<span>ׂ</span>ימות <span>✦</span></div>
    <div class="app-tagline">אנחנו לא בהשוואה — אנחנו בהשראה</div>
  </div>

  <!-- PHASE 3: NOTIFICATIONS BUTTONS AREA -->
  <div class="notification-panel">
    <button id="btnToggleNoti" class="btn-noti" onclick="requestNotificationPermission()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="notiBtnText">הפעל התראות בנייד</span>
    </button>
    <button class="btn-test-noti" onclick="triggerTestNotification()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      בדיקת התראה מיידית (Test)
    </button>
  </div>

  <!-- PHASE 3: PERSISTENT BANNER REMINDER -->
  <div id="persistentBanner" class="alert-banner">
    <div class="alert-banner-content">
      <span style="font-size:18px;">⚠️</span>
      <div class="alert-banner-text" id="bannerText">טרם סימנת וי על המשימה המתוכננת להיום! המשימה מחכה לך.</div>
    </div>
    <button class="btn-ghost" style="border-color:#fca5a5;color:#991b1b;padding:4px 8px;font-size:11px;" onclick="focusTodayTask()">הצג לי</button>
  </div>

  <div class="main-layout">
    <!-- LEFT: WEEKLY -->
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">📅 הלו"ז השבועי</div>
          <div style="font-size:11px;color:#9ca3af;margin-top:2px;" id="weekLabel"></div>
        </div>
        <button class="btn-auto" onclick="generateSchedule()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          ייצור לו"ז אוטומטי
        </button>
      </div>
      <div class="panel-body">
        <div class="algo-note" id="algoNote" style="display:none;"></div>
        <div class="week-header-row" id="dayHeaders"></div>
        <div class="day-col" id="daySlots"></div>
      </div>
    </div>
    <!-- RIGHT -->
    <div class="right-col">
      <div class="panel">
        <div class="panel-header">
          <div>
            <div class="panel-title">📋 בנק המשימות</div>
            <div id="progressLabel" style="font-size:11px;color:#9ca3af;margin-top:2px;"></div>
          </div>
          <button class="btn-primary" onclick="openModal('add')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            משימה חדשה
          </button>
        </div>
        <div class="panel-body">
          <div class="pills" id="catPills"></div>
          <div class="prog-wrap"><div class="prog-bar" id="progressBar" style="width:0%"></div></div>
          <div class="task-list" id="taskList"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">🏷️ קטגוריות</div>
          <button class="btn-ghost" onclick="openModal('cat')" style="font-size:12px;padding:5px 10px;">+ הוסף</button>
        </div>
        <div class="panel-body" id="catSidebar" style="padding-top:10px;"></div>
      </div>
    </div>
  </div>
</div>
<div id="modalContainer"></div>

<script>
const DAYS=[
  {key:'sun',label:'א׳',full:'ראשון',weekend:false,index:0},
  {key:'mon',label:'ב׳',full:'שני',weekend:false,index:1},
  {key:'tue',label:'ג׳',full:'שלישי',weekend:false,index:2},
  {key:'wed',label:'ד׳',full:'רביעי',weekend:false,index:3},
  {key:'thu',label:'ה׳',full:'חמישי',weekend:false,index:4},
  {key:'fri',label:'שישי',full:'שישי',weekend:true,index:5},
  {key:'sat',label:'שבת',full:'שבת',weekend:true,index:6}
];
const DC=[
  {id:'exp',name:'חוויות',color:'#fce7f3',text:'#9d174d',border:'#f9a8d4'},
  {id:'study',name:'לימודים ועתיד',color:'#dcfce7',text:'#166534',border:'#86efac'},
  {id:'health',name:'בריאות ואישי',color:'#ffedd5',text:'#9a3412',border:'#fdba74'},
  {id:'work',name:'עבודה',color:'#e0f2fe',text:'#075985',border:'#7dd3fc'},
  {id:'money',name:'כספים',color:'#fef9c3',text:'#854d0e',border:'#fde047'},
  {id:'social',name:'קשרים חברתיים',color:'#dbeafe',text:'#1e40af',border:'#93c5fd'}
];
let cats=JSON.parse(localStorage.getItem('mish_cats')||'null')||DC;
let tasks=JSON.parse(localStorage.getItem('mish_tasks')||'[]');
let schedule=JSON.parse(localStorage.getItem('mish_sched')||'{}');
let filter='all';
let editId=null;

function save(){
  localStorage.setItem('mish_cats',JSON.stringify(cats));
  localStorage.setItem('mish_tasks',JSON.stringify(tasks));
  localStorage.setItem('mish_sched',JSON.stringify(schedule));
}
function getCat(id){return cats.find(c=>c.id===id)||{name:'?',color:'#f3f4f6',text:'#374151',border:'#d1d5db'};}
function uid(){return Math.random().toString(36).slice(2,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getTask(id){return tasks.find(t=>t.id===id)||null;}

// ── PHASE 3: NOTIFICATION & LOCK SYSTEM ENGINE ────────────────
function getTodayKey() {
  const dayIndex = new Date().getDay();
  const map = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  return map[dayIndex];
}

function updatePersistentLockBanner() {
  const banner = document.getElementById('persistentBanner');
  const todayKey = getTodayKey();
  const todayTaskId = schedule[todayKey];
  const todayTask = todayTaskId ? getTask(todayTaskId) : null;

  if (todayTask && !todayTask.done) {
    document.getElementById('bannerText').innerHTML = `⚠️ חסר V להיום! המשימה שלך ליום ${DAYS.find(d=>d.key===todayKey).full}: <strong>${esc(todayTask.title)}</strong> מחכה שתשלימי אותה.`;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

function requestNotificationPermission() {
  if (!('Notification' in window)) {
    alert('אנא שימי לב: באייפון (iOS), כדי להפעיל התראות, עלייך קודם כל ללחוץ על כפתור השיתוף בספארי, לבחור "הוסף למסך הבית", ולפתוח את האפליקציה משם!');
    return;
  }
  Notification.requestPermission().then(permission => {
    updateNotiButtonUI(permission);
    if(permission === 'granted') {
      sendSystemNotification('התראות הופעלו בהצלחה!', 'המערכת תשלח לך תזכורות יומיות על משימות.');
    }
  });
}

function updateNotiButtonUI(status) {
  const btn = document.getElementById('btnToggleNoti');
  const text = document.getElementById('notiBtnText');
  const currentStatus = status || ( 'Notification' in window ? Notification.permission : 'default' );
  
  if (currentStatus === 'granted') {
    btn.classList.add('active');
    text.textContent = '✓ התראות בנייד פעילות';
  } else if (currentStatus === 'denied') {
    text.textContent = '❌ התראות חסומות בהגדרות';
  } else {
    text.textContent = 'הפעל התראות בנייד';
  }
}

function sendSystemNotification(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/9068/9068672.png' });
  }
}

function focusTodayTask() {
  const todayKey = getTodayKey();
  const slot = document.getElementById(`slot_${todayKey}`);
  if(slot) {
    slot.scrollIntoView({ behavior: 'smooth', block: 'center' });
    slot.style.transform = 'scale(1.05)';
    setTimeout(() => slot.style.transform = 'none', 1000);
  }
}

function runDailyCheck(isTest = false) {
  const todayKey = getTodayKey();
  const todayTask = schedule[todayKey] ? getTask(schedule[todayKey]) : null;
  const currentDayIndex = new Date().getDay();

  if (currentDayIndex === 6 || (isTest && todayKey === 'sat')) {
    openModal('saturdayReport');
    sendSystemNotification('📊 זמן לדו"ח המשימות השבועי', 'לחצי כדי לראות מה השלמת השבוע ומה נשאר בבנק המשימות.');
    return;
  }

  if (todayTask) {
    if (!todayTask.done) {
      sendSystemNotification(`📌 משימה מחכה לך היום (${DAYS.find(d=>d.key===todayKey).full})`, `${todayTask.title}`);
    }
  } else {

}

function removeFromDay(k){schedule[k]=null;save();renderWeek();}

// ── SMART AUTO-SCHEDULE ──────────────────────────────────────
function generateSchedule(){
  const usedIds=Object.values(schedule).filter(Boolean);
  const activeTasks=tasks.filter(t=>!t.done&&!usedIds.includes(t.id));

  if(!activeTasks.length){
    showNote('⚠️ אין משימות פנויות לשיבוץ.','#fff7ed','#9a3412');return;
  }

  const catCounts={};
  activeTasks.forEach(t=>{catCounts[t.cat]=(catCounts[t.cat]||0)+1;});
  const sortedCats=Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);

  const SPLIT_THRESHOLD=2; 
  const splitCandidates=sortedCats.filter(cid=>catCounts[cid]>=SPLIT_THRESHOLD);
  const doSplit=splitCandidates.length>=2;

  let pools; 
  const weekdayKeys=['sun','mon','tue','wed','thu'];

  if(doSplit){
    const catA=splitCandidates[0], catB=splitCandidates[1];
    const poolA=activeTasks.filter(t=>t.cat===catA);
    const poolB=activeTasks.filter(t=>t.cat===catB);
    pools=[
      poolA.shift()||null, poolA.shift()||null,
      poolB.shift()||null, poolB.shift()||null, poolB.shift()||null
    ];
    const cA=getCat(catA),cB=getCat(catB);
    showNote(`✨ א׳-ב׳ ← <strong>${esc(cA.name)}</strong> &nbsp;|&nbsp; ג׳-ה׳ ← <strong>${esc(cB.name)}</strong>. שישי-שבת פנויים.`,'#f5f0ff','#6d28d9');
  } else {
    const pool=[...activeTasks];
    pools=weekdayKeys.map(()=>pool.shift()||null);
    showNote('✨ הלו"ז מולא ממשימות פנויות (ללא חלוקה לקטגוריות — יש מעט משימות).','#f0fdf4','#166534');
  }

  weekdayKeys.forEach((k,i)=>{if(pools[i])schedule[k]=pools[i].id;});
  save();renderWeek();
}

function showNote(html,bg,color){
  const n=document.getElementById('algoNote');
  n.style.display='block';n.style.background=bg;n.style.color=color;n.innerHTML=html;
}

// ── DRAG & DROP ──────────────────────────────────────────────
function dragOver(e,k){e.preventDefault();const s=document.getElementById('slot_'+k); if(s) s.classList.add('drag-over');}
function dragLeave(e,k){const s=document.getElementById('slot_'+k); if(s) s.classList.remove('drag-over');}
function dropOnDay(e,k){
  e.preventDefault();const s=document.getElementById('slot_'+k); if(s) s.classList.remove('drag-over');
  const tId=e.dataTransfer.getData('taskId');
  if(tId){schedule[k]=tId;save();renderWeek();}
}

// ── TASK BANK RENDER ─────────────────────────────────────────
function renderPills(){
  const el=document.getElementById('catPills');
  let h=`<span class="pill pill-all${filter==='all'?' active':''}" onclick="setFilter('all')">הכל</span>`;
  cats.forEach(c=>{
    h+=`<span class="pill${filter===c.id?' active':''}" style="background:${c.color};color:${c.text};border-color:${filter===c.id?c.border:'transparent'}" onclick="setFilter('${c.id}')">${c.name}</span>`;
  });
  h+=`<span class="pill pill-done${filter==='done'?' active':''}" onclick="setFilter('done')">✓ הושלם</span>`;
  el.innerHTML=h;
}

function renderTasks(){
  const el=document.getElementById('taskList');
  let list;
  if(filter==='done'){
    list=tasks.filter(t=>t.done);
  } else if(filter==='all'){
    list=tasks.filter(t=>!t.done);
  } else {
    list=tasks.filter(t=>t.cat===filter&&!t.done);
  }
  list=[...list].sort((a,b)=>{
    const p={high:0,med:1,low:2};
    return (p[a.prio]??2)-(p[b.prio]??2);
  });
  if(!list.length){
    el.innerHTML=`<div class="task-empty"><div style="font-size:26px;opacity:.18;margin-bottom:6px;">${filter==='done'?'🎉':'✦'}</div><div>${filter==='done'?'אין משימות שהושלמו עדיין':'אין משימות פעילות'}</div></div>`;
    return;
  }
  const pl={high:'גבוהה',med:'בינונית',low:'נמוכה'};
  const pc={high:'prio-high',med:'prio-med',low:'prio-low'};
  el.innerHTML=list.map(t=>{
    const c=getCat(t.cat);
    return `<div class="task-card fade-in${t.done?' done':''}" style="background:${c.color};border-color:${c.border}"
      draggable="true" ondragstart="event.dataTransfer.setData('taskId','${t.id}')">
      <div class="task-check${t.done?' checked':''}" onclick="toggleTask('${t.id}')">
        <span class="chk-mark" style="color:${c.text}">✓</span>
      </div>
      <div class="task-content">
        <div class="task-title" style="color:${c.text}">${esc(t.title)}</div>
        ${t.note?`<div class="task-note">${esc(t.note)}</div>`:''}
        <div class="task-meta">
          <span class="cat-badge" style="background:rgba(255,255,255,0.5);color:${c.text};border-color:${c.border}">${c.name}</span>
          ${t.prio?`<span class="prio-tag ${pc[t.prio]}">${pl[t.prio]}</span>`:''}
          ${t.due?`<span class="task-date">📅 ${t.due}</span>`:''}
        </div>
      </div>
      <div class="task-actions">
        <button class="btn-icon" onclick="openModal('edit','${t.id}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
        </button>
        <button class="btn-icon danger" onclick="deleteTask('${t.id}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=total?`${done} מתוך ${total} הושלמו`:'';

function renderCatSidebar(){

      </button>`:''}

function render(){renderPills();renderTasks();renderProgress();renderCatSidebar();renderWeek();}
function setFilter(id){filter=id;render();}

function toggleTask(id){
  const t=tasks.find(t=>t.id===id);
  if(t){
    t.done=!t.done;
    save();
    render();
  }
}
function deleteTask(id){
  tasks=tasks.filter(t=>t.id!==id);
  DAYS.forEach(d=>{if(schedule[d.key]===id)schedule[d.key]=null;});
  save();render();
}
function deleteCat(id){
  if(tasks.some(t=>t.cat===id)){
    if(!confirm('קיימות משימות בקטגוריה זו. למחוק גם אותן?'))return;
    const tIds=tasks.filter(t=>t.cat===id).map(t=>t.id);
    tasks=tasks.filter(t=>t.cat!==id);
    DAYS.forEach(d=>{if(tIds.includes(schedule[d.key]))schedule[d.key]=null;});
  }
  cats=cats.filter(c=>c.id!==id);
  if(filter===id)filter='all';
  save();render();
}

function closeModal(){document.getElementById('modalContainer').innerHTML='';editId=null;}
function closeBg(e){if(e.target.classList.contains('modal-overlay'))closeModal();}

function assignToDay(k){
  const tId=document.getElementById('d_task').value;
  if(tId){schedule[k]=tId;save();renderWeek();}
  closeModal();
}
function rescheduleDay(fromKey){
  const toKey=document.getElementById('r_day').value;
  if(toKey===fromKey){closeModal();return;}
  const tId=schedule[fromKey],destId=schedule[toKey];
  schedule[toKey]=tId;schedule[fromKey]=destId||null;
  save();renderWeek();closeModal();
}

function saveTask(){
  const title=document.getElementById('f_title').value.trim();
  if(!title){document.getElementById('f_title').style.borderColor='#f87171';document.getElementById('f_title').focus();return;}
  const cat=document.getElementById('f_cat').value,prio=document.getElementById('f_prio').value,
        due=document.getElementById('f_due').value,note=document.getElementById('f_note').value.trim();
  if(editId){
    const t=tasks.find(t=>t.id===editId);
    if(t){t.title=title;t.cat=cat;t.prio=prio;t.due=due;t.note=note;}
  }else{
    tasks.unshift({id:uid(),title,cat,prio,due,note,done:false,created:Date.now()});
  }
  save();render();closeModal();
}

function darken(hex,f=0.4){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}
function bord(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgb(${Math.round(r*0.82)},${Math.round(g*0.82)},${Math.round(b*0.82)})`;
}
function rgbToHex(val){
  if(val&&val.startsWith('#'))return val;
  const m=val&&val.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if(!m)return'#e8f4fd';
  return'#'+[m[1],m[2],m[3]].map(n=>parseInt(n).toString(16).padStart(2,'0')).join('');
}

function saveCat(){
  const name=document.getElementById('c_name').value.trim();
  if(!name){document.getElementById('c_name').style.borderColor='#f87171';document.getElementById('c_name').focus();return;}
  const color=document.getElementById('c_color').value;
  cats.push({id:uid(),name,color,text:darken(color),border:bord(color),custom:true});
  save();render();closeModal();
}
function updateCat(){
  const name=document.getElementById('c_name').value.trim();
  if(!name){document.getElementById('c_name').style.borderColor='#f87171';document.getElementById('c_name').focus();return;}
  const color=document.getElementById('c_color').value;
  const c=cats.find(c=>c.id===editId);
  if(c){c.name=name;c.color=color;c.text=darken(color);c.border=bord(color);}
  save();render();closeModal();
}

// ── INIT RUN ─────────────────────────────────────────────────
render();
updateNotiButtonUI();
setTimeout(updatePersistentLockBanner, 500);
setInterval(updatePersistentLockBanner, 3600000);
</script>
